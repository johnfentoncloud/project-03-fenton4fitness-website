<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Share Your Experience | Fenton4Fitness</title><meta name="description" content="Privately submit a Fenton4Fitness testimonial for review."><link rel="stylesheet" href="style.css?v=20260723-production"></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><nav class="nav-wrap"><a class="brand" href="index.html"><img src="images/f4f-logo.png" alt=""><span>Fenton4Fitness</span></a><a class="btn btn-secondary" href="testimonials.html">Back to Testimonials</a></nav></header><main id="main"><header class="page-hero"><div class="container"><p class="eyebrow">Private review form</p><h1>Share your experience.</h1><p class="lead">Thank you for taking the time. Your submission will be reviewed by Fenton4Fitness and will not be published automatically.</p></div></header><section class="section"><div class="container form-shell"><form id="testimonial-form" data-aws-form method="post" novalidate><div class="form-grid"><div class="field"><label for="name">Name <span class="required">*</span></label><input id="name" name="name" required autocomplete="name"></div><div class="field"><label for="email">Email <span class="required">*</span></label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="relationship">Relationship to Fenton4Fitness</label><select id="relationship" name="relationship"><option>Parent</option><option>Athlete</option><option>Adult client</option><option>Coach or organization</option><option>Other</option></select></div><div class="field"><label for="coach">Who coached you or your athlete?</label><select id="coach" name="coachRelationship"><option value="john">John</option><option value="jess">Jess</option><option value="both">Both</option><option value="fenton4fitness">Fenton4Fitness team</option></select></div><div class="field field-full"><label for="program">Program or team</label><input id="program" name="program"></div><div class="field field-full"><label for="experience">What was the experience like? <span class="required">*</span></label><textarea id="experience" name="experience" required></textarea></div><div class="field field-full"><label for="improvements">What improvements or results did you notice?</label><textarea id="improvements" name="improvements"></textarea></div><div class="field field-full"><label for="standout">What stood out about the coaching?</label><textarea id="standout" name="standout"></textarea></div><div class="field"><label for="recommend">Would you recommend Fenton4Fitness?</label><select id="recommend" name="recommend"><option value="yes">Yes</option><option value="no">No</option><option value="unsure">Unsure</option></select></div><div class="field field-full"><label class="checkbox"><input type="checkbox" name="permissionPublish" value="yes"><span>Fenton4Fitness may publish an edited version of this testimonial after contacting me for final approval.</span></label></div><div class="field field-full"><label class="checkbox"><input type="checkbox" name="permissionFullName" value="yes"><span>Fenton4Fitness may use my full name if the testimonial is approved.</span></label></div><div class="field field-full"><label class="checkbox"><input type="checkbox" name="permissionPhoto" value="yes"><span>I may be contacted separately about use of an approved photograph. (No photo is uploaded here.)</span></label></div><div class="hp-field"><label for="website">Website</label><input id="website" name="website" tabindex="-1"></div></div><button class="btn" type="submit" data-label="Submit for Review">Submit for Review</button><div class="form-status" role="status" aria-live="polite" tabindex="-1" hidden></div></form></div></section></main><footer class="site-footer"><div class="container"><p class="fineprint">© <span data-year></span> Fenton4Fitness.</p></div></footer><script src="config.js?v=20260723-form-fix"></script><script src="script.js?v=20260723-production"></script></body></html>
